<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tree Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@400;600;700&display=swap">
<style>
/* Layout: one-screen classroom console, as in the other DSA27 labs. Code on the left;
   the picture of the list on the right, with the variables and counters under it;
   transport bar along the bottom. */
:root {
  --bg: #e9edf2;
  --panel: #ffffff;
  --panel-2: #f4f6f9;
  --ink: #142033;
  --muted: #5a6679;
  --line: #d3d9e2;
  --accent: #c76a00;        /* the running line, the pair being compared */
  --accent-bg: #ffefcc;
  --wait: #3456c7;          /* the smallest so far, the current value */
  --wait-bg: #e6ecfc;
  --done: #23803a;          /* in its final place */
  --done-bg: #e2f4e6;
  --prefix-bg: #dcf3f6;     /* sorted so far, not yet final (insertion sort) */
  --hole: #c92a3a;
  --hole-bg: #fde4e7;
  --bar: #c9d3e3;
  --kw: #8a2bb8; --str: #237a3a; --num: #b4520b; --com: #7b8798; --fn: #1d5fd0;
  --shadow: 0 1px 2px rgba(20,32,51,.06), 0 4px 14px rgba(20,32,51,.06);
  --f-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --f-code: "JetBrains Mono", Consolas, "Cascadia Mono", monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f141b; --panel: #171e28; --panel-2: #1d2532; --ink: #e4e9f1; --muted: #9aa6b8;
    --line: #2b3545; --accent: #ffad47; --accent-bg: #3a2a12; --wait: #8ea6ff; --wait-bg: #1d2747;
    --done: #6fd38a; --done-bg: #173322; --prefix-bg: #133338; --hole: #ff7b88; --hole-bg: #3a1a20;
    --bar: #34405a; --kw: #d39bff; --str: #7fd492; --num: #ffb27a; --com: #7c879a; --fn: #8db6ff;
    --shadow: none;
  }
}
:root[data-theme="dark"] {
  --bg: #0f141b; --panel: #171e28; --panel-2: #1d2532; --ink: #e4e9f1; --muted: #9aa6b8;
  --line: #2b3545; --accent: #ffad47; --accent-bg: #3a2a12; --wait: #8ea6ff; --wait-bg: #1d2747;
  --done: #6fd38a; --done-bg: #173322; --prefix-bg: #133338; --hole: #ff7b88; --hole-bg: #3a1a20;
  --bar: #34405a; --kw: #d39bff; --str: #7fd492; --num: #ffb27a; --com: #7c879a; --fn: #8db6ff;
  --shadow: none;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font: 15px/1.45 var(--f-body);
  display: grid; grid-template-rows: auto 1fr auto; }
button, select, input { font: inherit; color: inherit; }
.mono, code, kbd, .code, .chip, .cell, .val, .idx, .vars table { font-family: var(--f-code); font-variant-ligatures: none; font-feature-settings: "liga" 0, "calt" 0; }
kbd { font-size: 11px; padding: 0 4px; border: 1px solid var(--line); border-radius: 4px; color: var(--muted); }

header.top { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center;
  padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--line); }
.brand b { font-size: 18px; margin-right: 8px; }
.brand span { color: var(--muted); font-size: 13px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; }
.seg button { border: 0; background: transparent; padding: 6px 12px; cursor: pointer; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button.on { background: var(--ink); color: var(--panel); }
.inputs { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.inputs select, .inputs input[type=text] { padding: 6px 8px; border: 1px solid var(--line);
  border-radius: 8px; background: var(--panel-2); }
.inputs input[type=text] { width: 15em; font-family: var(--f-code); font-size: 13px; }
.tools { margin-left: auto; display: flex; gap: 6px; }
.btn { padding: 6px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel-2);
  cursor: pointer; white-space: nowrap; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--ink); color: var(--panel); border-color: var(--ink); }
.btn.on { background: var(--accent-bg); border-color: var(--accent); }
.btn.bug.on { background: var(--hole-bg); border-color: var(--hole); }
.btn:disabled { opacity: .45; cursor: default; }

main { display: grid; gap: 12px; padding: 12px; min-height: 0;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr);
  grid-template-rows: minmax(0, 1fr) auto;
  grid-template-areas: "code pic" "code vars"; }
.pane { min-width: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
  box-shadow: var(--shadow); display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
.pane-head { display: flex; justify-content: space-between; gap: 8px; padding: 8px 14px;
  border-bottom: 1px solid var(--line); font-weight: 700; }
.pane-head .meta { font-weight: 400; color: var(--muted); font-size: 13px; }
.code-pane { grid-area: code; }
.pic-pane { grid-area: pic; }
.vars-pane { grid-area: vars; }

.about { padding: 10px 14px 4px; }
.about h1 { font-size: 17px; margin: 0 0 2px; }
.about p { margin: 0; color: var(--muted); font-size: 14px; }
.code { font: 13.5px/1.6 var(--f-code); padding: 8px 0; overflow: auto; flex: 0 0 auto; }
.ln { display: grid; grid-template-columns: 3em 1fr; white-space: pre; padding-right: 12px; }
.ln .no { color: var(--muted); text-align: right; padding-right: 1em; user-select: none; }
.ln.run { background: var(--accent-bg); box-shadow: inset 3px 0 var(--accent); }
.ln.mistake .tx { text-decoration: underline wavy var(--hole); text-underline-offset: 4px; }
.k { color: var(--kw); } .n { color: var(--num); } .c { color: var(--com); font-style: italic; } .f { color: var(--fn); }
.narr { margin: 6px 14px 14px; padding: 10px 12px; border-radius: 10px; background: var(--panel-2);
  border: 1px solid var(--line); min-height: 4.2em; }
.narr b { color: var(--accent); }
.qcard { margin: 0 14px 14px; padding: 10px 12px; border: 2px solid var(--wait); border-radius: 10px; background: var(--wait-bg); }
.qlabel { font-weight: 700; color: var(--wait); font-size: 13px; text-transform: uppercase; letter-spacing: .04em; }
.qtext { margin: 4px 0 8px; }
.choices { display: flex; flex-wrap: wrap; gap: 6px; }
.choices .btn.right { background: var(--done-bg); border-color: var(--done); }
.choices .btn.wrong { background: var(--hole-bg); border-color: var(--hole); }
.qwhy { margin-top: 8px; font-size: 14px; }

.picbox { flex: 1; min-height: 220px; padding: 12px 16px 8px; display: flex; flex-direction: column; gap: 10px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; min-height: 30px; align-items: center; }
.chip { font-family: var(--f-code); font-size: 13px; padding: 3px 9px; border-radius: 999px; border: 1px solid var(--line); background: var(--panel-2); }
.chip.cur { border-color: var(--wait); background: var(--wait-bg); color: var(--wait); font-weight: 700; }
.verdict { font-weight: 700; padding: 3px 10px; border-radius: 8px; }
.verdict.ok { color: var(--done); background: var(--done-bg); }
.verdict.bad { color: var(--hole); background: var(--hole-bg); }
.bars { height: clamp(170px, 34vh, 360px); display: flex; align-items: flex-end; gap: 6px; }
.col { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; align-items: center; height: 100%; justify-content: flex-end; }
.bar { width: 100%; border-radius: 6px 6px 2px 2px; background: var(--bar); border: 2px solid transparent;
  transition: height .18s ease, background-color .18s; display: flex; align-items: flex-start; justify-content: center; }
.val { font: 700 13px var(--f-code); margin-bottom: 3px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
.idx { font: 11px var(--f-code); color: var(--muted); margin-top: 4px; }
.card { width: 100%; height: 76px; border-radius: 8px; border: 2px solid var(--line); background: var(--panel-2);
  display: flex; flex-direction: column; align-items: center; justify-content: center; }
.card .key { font: 700 22px var(--f-code); }
.card .nm { font-size: 12px; color: var(--muted); }
.cmp .bar, .cmp .card { background: var(--accent-bg); border-color: var(--accent); }
.min .bar, .min .card { background: var(--wait-bg); border-color: var(--wait); }
.final .bar, .final .card { background: var(--done-bg); border-color: var(--done); }
.prefix .bar, .prefix .card { background: var(--prefix-bg); }
.hole .bar, .hole .card { background: var(--hole-bg); border: 2px dashed var(--hole); }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12.5px; color: var(--muted); }
.sw { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; border: 2px solid var(--line); }

.rows { display: grid; grid-template-columns: auto 1fr; gap: 8px 12px; align-items: center; }
.rows .lab { font: 13px var(--f-code); color: var(--muted); text-align: right; }
.cells { display: flex; flex-wrap: wrap; gap: 4px; }
.cell { min-width: 2.2em; padding: 4px 6px; text-align: center; font: 700 14px var(--f-code); border: 1px solid var(--line);
  border-radius: 6px; background: var(--panel-2); position: relative; }
.cell sub { position: absolute; top: -14px; left: 0; right: 0; font: 10px var(--f-code); color: var(--muted); }
.cells.idxd { margin-top: 12px; row-gap: 18px; }
.cell.cmp { background: var(--accent-bg); border-color: var(--accent); }
.cell.final { background: var(--done-bg); border-color: var(--done); }

.varwrap { display: grid; grid-template-columns: 1fr 1fr; gap: 0; }
.vars, .counters { padding: 8px 14px 12px; }
.counters { border-left: 1px solid var(--line); }
.vars table { border-collapse: collapse; font: 13.5px var(--f-code); }
.vars td { padding: 2px 10px 2px 0; }
.vars td:first-child { color: var(--muted); }
.vars tr.chg td:last-child { color: var(--accent); font-weight: 700; }
.ctr { display: flex; justify-content: space-between; gap: 8px; padding: 3px 0; font-size: 14px; }
.ctr b { font: 700 16px var(--f-code); }
.ctr.inv b { color: var(--wait); }
.cfoot { font-size: 12.5px; color: var(--muted); margin-top: 4px; }

footer.transport { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; padding: 10px 16px;
  background: var(--panel); border-top: 1px solid var(--line); }
.group { display: flex; gap: 6px; flex-wrap: wrap; }
.speed, .scrub { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
.scrub { flex: 1; min-width: 180px; }
.scrub input { flex: 1; }
.pos { font: 12px var(--f-code); min-width: 7em; text-align: right; }
#selftest { margin: 12px; padding: 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; white-space: pre-wrap; }

@media (max-width: 1050px) {
  html, body { height: auto; }
  body { display: block; }
  main { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto; grid-template-areas: "pic" "vars" "code"; }
  .picbox { min-height: 260px; }
  footer.transport { position: sticky; bottom: 0; z-index: 2; }
}
@media (max-width: 560px) {
  .varwrap { grid-template-columns: 1fr; }
  .counters { border-left: 0; border-top: 1px solid var(--line); }
  .tools { margin-left: 0; }
  .inputs { width: 100%; }
  .inputs select, .inputs input[type=text] { flex: 1 1 100%; width: auto; min-width: 0; }
}
@media (prefers-reduced-motion: reduce) { .bar { transition: none; } }
/* Last, so that no `font:` shorthand above resets it: students must see >= and != as typed. */
.code, .code *, .chip, .cell, .val, .idx, .vars table, .ctr b, kbd, input[type=text] {
  font-variant-ligatures: none; font-feature-settings: "liga" 0, "calt" 0; }
/* Tree Lab additions: the tree, the output list, the queue, the call stack. */
.stackbox { padding: 8px 14px 12px; border-top: 1px solid var(--line); }
.frames { display: flex; flex-direction: column; gap: 3px; font: 12.5px var(--f-code); max-height: 8.5em; overflow: auto; }
.fr { padding: 2px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel-2); }
.fr.top { border-color: var(--accent); background: var(--accent-bg); font-weight: 700; }
.treewrap { flex: 1; min-height: 220px; display: flex; align-items: center; justify-content: center; }
svg.tree { width: 100%; max-height: 360px; }
svg.tree line { stroke: var(--muted); stroke-width: 2; }
svg.tree line.path { stroke: var(--wait); stroke-width: 3.5; }
svg.tree circle { fill: var(--panel-2); stroke: var(--muted); stroke-width: 1.6; }
svg.tree text { font: 700 15px var(--f-code); fill: var(--ink); text-anchor: middle; dominant-baseline: central; }
svg.tree .path circle { stroke: var(--wait); stroke-width: 3; }
svg.tree .visited circle { fill: var(--done-bg); }
svg.tree .cur circle { fill: var(--accent-bg); stroke: var(--accent); stroke-width: 3.5; }
svg.tree .found circle, svg.tree .new circle { fill: var(--done-bg); stroke: var(--done); stroke-width: 3.5; }
svg.tree .succ circle { fill: var(--wait-bg); stroke: var(--wait); stroke-width: 3.5; stroke-dasharray: 5 3; }
svg.tree .gone circle { fill: var(--hole-bg); stroke: var(--hole); stroke-dasharray: 4 3; }
svg.tree .bad circle { fill: var(--hole-bg); stroke: var(--hole); stroke-width: 3; }
svg.tree .lbl { font: 11px var(--f-code); fill: var(--muted); }
.ghost { font: 700 13px var(--f-code); color: var(--muted); }
.listrow { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; min-height: 28px; }
.listrow .lab { font: 12px var(--f-code); color: var(--muted); min-width: 4.4em; }
.listrow .cell.new { background: var(--done-bg); border-color: var(--done); }
.listrow .cell.front { background: var(--accent-bg); border-color: var(--accent); }
.opbar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.opbar select, .opbar input[type=text] { padding: 6px 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel-2); }
.opbar input.val { width: 5em; font-family: var(--f-code); }
</style>
</head>
<body>

<header class="top">
  <div class="brand"><b>Tree Lab</b><span>DSA27 · Lecture 11</span></div>
  <div class="inputs">
    <select id="preset" aria-label="Tree"></select>
    <input type="text" id="custom" placeholder="build from: 50, 30, 70" aria-label="Build a tree from your values">
    <button class="btn" id="buildBtn" title="Build a tree from your values (Enter)">Build</button>
  </div>
  <div class="opbar">
    <select id="op" aria-label="Operation"></select>
    <input type="text" id="val" class="val" value="7" aria-label="Value">
    <button class="btn primary" id="runBtn" title="Run this operation">Run</button>
  </div>
  <div class="tools">
    <button class="btn bug" id="bugBtn" title="Run the common mistake (M)">Common mistake <kbd>M</kbd></button>
    <button class="btn" id="themeBtn" title="Switch light / dark">Theme</button>
    <button class="btn" id="fsBtn" title="Full screen (F)">Full screen</button>
  </div>
</header>

<main>
  <section class="pane code-pane">
    <div class="pane-head"><span>Code</span><span class="meta" id="lineInfo"></span></div>
    <div class="about"><h1 id="title"></h1><p id="blurb"></p></div>
    <div class="code" id="code"></div>
    <div class="narr" id="narr" aria-live="polite"></div>
    <div id="qbox"></div>
  </section>

  <section class="pane pic-pane">
    <div class="pane-head"><span>The tree</span><span class="meta" id="picMeta"></span></div>
    <div class="picbox">
      <div class="chips" id="chips"></div>
      <div class="treewrap" id="pic"></div>
      <div id="lists"></div>
      <div class="legend" id="legend"></div>
    </div>
  </section>

  <section class="pane vars-pane">
    <div class="varwrap">
      <div class="vars"><div class="pane-head" style="padding:0 0 6px;border:0">Variables</div><table id="vars"></table></div>
      <div class="counters"><div class="pane-head" style="padding:0 0 6px;border:0">Counters</div><div id="ctrs"></div></div>
    </div>
    <div class="stackbox"><div class="pane-head" style="padding:0 0 6px;border:0"><span>Call stack</span><span class="meta">newest on top</span></div><div class="frames" id="stack"></div></div>
  </section>
</main>

<footer class="transport">
  <div class="group">
    <button class="btn" id="bRestart" title="Back to the start (R)">Restart <kbd>R</kbd></button>
    <button class="btn" id="bBack" title="One step back (Left arrow)">Back <kbd>&larr;</kbd></button>
    <button class="btn primary" id="bStep" title="One step (Right arrow or Space)">Step <kbd>&rarr;</kbd></button>
    <button class="btn" id="bPlay" title="Play / pause (P)">Play <kbd>P</kbd></button>
  </div>
  <div class="speed"><label for="speed">Speed</label><input type="range" id="speed" min="1" max="10" value="5"></div>
  <div class="scrub"><input type="range" id="scrub" min="0" max="0" value="0" aria-label="Jump to step"><span class="pos" id="pos"></span></div>
  <button class="btn" id="bQuiz" title="Ask before each decision (Q)">What happens next? off <kbd>Q</kbd></button>
</footer>

<pre id="selftest" hidden></pre>

<script>
/* =====================================================================
   ENGINE. Each operation is a JavaScript mirror of the Python on screen,
   line for line. The tree is a table of nodes {v, l, r} (l and r are
   indices into the table, or -1 for None). An operation runs once on a
   copy of the tree, and the tracer keeps a snapshot at every step, so
   Back and the scrubber are only an index into that list. When an
   operation that changes the tree ends, its result becomes the tree that
   the next operation starts from.
   ===================================================================== */

const $ = id => document.getElementById(id);
const NONE = -1;

// ---- the code on screen ----------------------------------------------------------
const CODE = {
  contains: () => [
    ['def',  'def contains(self, value):'],
    ['init', '    node = self.root'],
    ['loop', '    while node is not None:'],
    ['eq',   '        if value == node.value:'],
    ['yes',  '            return True'],
    ['step', S.bug ? '        node = node.right if value < node.value else node.left   # MISTAKE: the sides are swapped'
                   : '        node = node.left if value < node.value else node.right'],
    ['no',   '    return False'],
  ],
  insert: () => S.bug ? [
    ['def',  'def insert(self, value):'],
    ['empty','    if self.root is None:'],
    ['rootn','        self.root = TreeNode(value); return'],
    ['init', '    node = self.root'],
    ['loop', '    while node is not None:               # MISTAKE: walks past the parent'],
    ['eq',   '        if value == node.value:'],
    ['dup',  '            return'],
    ['step', '        node = node.left if value < node.value else node.right'],
    ['hang', '    node = TreeNode(value)                # only a LOCAL variable changes'],
  ] : [
    ['def',  'def insert(self, value):'],
    ['new',  '    new = TreeNode(value)'],
    ['empty','    if self.root is None:'],
    ['rootn','        self.root = new; return            # the new node IS the root'],
    ['init', '    node = self.root'],
    ['loop', '    while True:'],
    ['eq',   '        if value == node.value:'],
    ['dup',  '            return                         # already there: ignore'],
    ['lt',   '        if value < node.value:'],
    ['lnone','            if node.left is None:          # stop AT the parent ...'],
    ['lhang','                node.left = new; return     # ... and set its link'],
    ['lgo',  '            node = node.left'],
    ['else', '        else:'],
    ['rnone','            if node.right is None:'],
    ['rhang','                node.right = new; return'],
    ['rgo',  '            node = node.right'],
  ],
  min: () => [
    ['def',  'def min(self):'],
    ['empty','    if self.root is None:'],
    ['err',  '        raise ValueError("min of an empty tree")'],
    ['init', '    node = self.root'],
    ['loop', '    while node.left is not None:         # go left for as long as you can'],
    ['go',   '        node = node.left'],
    ['ret',  '    return node.value'],
  ],
  max: () => [
    ['def',  'def max(self):'],
    ['empty','    if self.root is None:'],
    ['err',  '        raise ValueError("max of an empty tree")'],
    ['init', '    node = self.root'],
    ['loop', '    while node.right is not None:        # go right for as long as you can'],
    ['go',   '        node = node.right'],
    ['ret',  '    return node.value'],
  ],
  delete: () => [
    ['def',  'def delete(self, value):'],
    ['init', '    parent, node = None, self.root'],
    ['find', '    while node is not None and node.value != value:   # 1. find it, and its parent'],
    ['fstep','        parent = node; node = node.left if value < node.value else node.right'],
    ['nf',   '    if node is None:'],
    ['nfr',  '        return                                         # not there'],
    ['two',  '    if node.left is not None and node.right is not None:'],
    ['sinit','        parent, successor = node, node.right           # 2. right once,'],
    ['sloop','        while successor.left is not None:              #    then left as far as possible'],
    ['sstep','            parent, successor = successor, successor.left'],
    ['copy', '        node.value = successor.value                   #    copy it up ...'],
    ['hand', '        node = successor                               #    ... and delete IT instead'],
    ['child','    child = node.left if node.left is not None else node.right   # 3. at most one child'],
    ['root', '    if parent is None:'],
    ['setr', '        self.root = child'],
    ...(S.bug ? [
      ['else', '    else:'],
      ['setl', '        parent.left = child                            # MISTAKE: always the LEFT link'],
    ] : [
      ['isl',  '    elif parent.left is node:'],
      ['setl', '        parent.left = child'],
      ['else', '    else:'],
      ['setrr','        parent.right = child'],
    ]),
  ],
  in_order: () => walkCode('in'),

// ---- the tree as a table -----------------------------------------------------------------
function emptyTree() { return { nodes: [], root: NONE }; }
function plainInsert(t, v) {
  const id = t.nodes.length;
  if (t.root === NONE) { t.nodes.push({ v, l: NONE, r: NONE }); t.root = id; return; }
  let n = t.root;
  for (;;) {
    const node = t.nodes[n];
    if (v === node.v) return;
    const side = v < node.v ? 'l' : 'r';
    if (node[side] === NONE) { t.nodes.push({ v, l: NONE, r: NONE }); node[side] = id; return; }
    n = node[side];
  }
}
function buildTree(values) { const t = emptyTree(); for (const v of values) plainInsert(t, v); return t; }
function brokenTree() {   // 8 with 3 and 10; 9 as 3's right child: every parent-child pair looks fine
  return { root: 0, nodes: [{ v: 8, l: 1, r: 2 }, { v: 3, l: 3, r: 4 }, { v: 10, l: NONE, r: NONE }, { v: 1, l: NONE, r: NONE }, { v: 9, l: NONE, r: NONE }] };
}
function copyTree(t) { return { root: t.root, nodes: t.nodes.map(n => ({ ...n })) }; }

  const seen = new Set(), stack = t.root === NONE ? [] : [t.root];
  while (stack.length) { const n = stack.pop(); if (seen.has(n)) continue; seen.add(n); const x = t.nodes[n]; if (x.r !== NONE) stack.push(x.r); if (x.l !== NONE) stack.push(x.l); }

}

}

  const seen = new Set();
  return (function h(n) { if (n === NONE || seen.has(n)) return -1; seen.add(n); return 1 + Math.max(h(t.nodes[n].l), h(t.nodes[n].r)); })(t.root);
}
function validBST(t) {
  const seen = new Set();
  return (function ok(n, lo, hi) {
    if (n === NONE) return true;
    if (seen.has(n)) return false; seen.add(n);
    const v = t.nodes[n].v;
    if ((lo !== null && v <= lo) || (hi !== null && v >= hi)) return false;
    return ok(t.nodes[n].l, lo, v) && ok(t.nodes[n].r, v, hi);
  })(t.root, null, null);
}

// ---- tracer --------------------------------------------------------------------------------
class Tracer {
  constructor(op, tree, value) {
    this.op = op; this.value = value; this.code = CODE[op]();
    this.t = copyTree(tree); this.vars = {}; this.changed = new Set();
    this.cnt = { cmp: 0, visits: 0 }; this.hi = {}; this.path = []; this.stack = [];
    this.out = null; this.queue = null; this.frames = [];
  }
  line(label) { const i = this.code.findIndex(([l]) => l === label); if (i < 0) throw new Error('no line ' + label); return i; }
  set(o) { for (const k in o) { this.vars[k] = o[k]; this.changed.add(k); } }
  snap(label, msg, extra) {
    this.frames.push({ line: this.line(label), msg, tree: copyTree(this.t), vars: { ...this.vars }, changed: [...this.changed],
      cnt: { ...this.cnt }, hi: { ...this.hi }, path: this.path.slice(), stack: this.stack.slice(),
      out: this.out ? this.out.slice() : null, queue: this.queue ? this.queue.slice() : null, ...(extra || {}) });
    this.changed = new Set();
    return this.frames[this.frames.length - 1];
  }
  ask(q) { this.frames[this.frames.length - 1].q = q; }

}
const nodeName = (T, n) => n === NONE ? 'None' : `node(${T.t.nodes[n].v})`;

function runContains(T) {
  const value = T.value, t = T.t;
  T.set({ value }); T.snap('def', `<b>contains(${value})</b>: is ${value} in the tree?`);
  let n = t.root; T.set({ node: nodeName(T, n) }); T.hi = { cur: n }; T.snap('init', 'Start at the <b>root</b>.');
  while (true) {
    T.hi = { cur: n };
    if (n === NONE) { T.snap('loop', '<b>node is None</b>: we fell off the tree, exactly where the value would have been.'); break; }
    T.path.push(n); T.cnt.visits++;

    T.cnt.cmp++;
    const x = t.nodes[n].v;
    const dir = value === x ? 0 : ((value < x) !== S.bug ? 1 : 2);
    T.snap('eq', `Is ${value} == ${x}? <b>${value === x ? 'Yes' : 'No'}</b>.`);
    T.ask({ text: `Searching for ${value}. We are at ${x}. What happens next?`, choices: [`Found it: return True`, `Go left`, `Go right`], answer: dir,
      why: dir === 0 ? `${value} == ${x}.` : S.bug ? 'With the mistake, the sides are swapped.' : `${value} ${value < x ? '<' : '>'} ${x}, so ${value} can only be in the ${value < x ? 'left' : 'right'} subtree.` });
    if (value === x) { T.hi = { found: n }; T.snap('yes', `<b>Found ${value}</b> after ${T.cnt.cmp} comparison${T.cnt.cmp === 1 ? '' : 's'}. return True.`, { end: true, result: 'True' }); return; }
    if (T.cnt.cmp > 60) break;

    T.set({ node: nodeName(T, n) }); T.hi = { cur: n };
    T.snap('step', `${value} ${value < x ? '<' : '>'} ${x}: go <b>${dir === 1 ? 'left' : 'right'}</b>${n === NONE ? ', to None' : ''}.`);
  }

function runHeight(T) {

}

  if (!Number.isInteger(v)) { $('narr').innerHTML = 'Type a whole number in the value box, for example <b>7</b>.'; return null; }
  return v;
}
function runOp() {
  if (OPS[S.op].needs) { const v = parseValue(); if (v === null) return; S.value = v; }
  rebuild();
}
function buildCustom() {
  const raw = $('custom').value.trim(); if (!raw) return;
  const vs = raw.split(/[\s,\[\]]+/).filter(Boolean).map(Number);
  if (!vs.length || vs.some(v => !Number.isInteger(v))) { $('narr').innerHTML = 'Type whole numbers, for example <b>50, 30, 70</b>.'; return; }
  if (vs.length > 24) { $('narr').innerHTML = 'At most <b>24</b> values, so that the tree stays readable.'; return; }
  S.tree = buildTree(vs); rebuild();
}
function save(k, v) { try { localStorage.setItem('tree-lab-' + k, v); } catch (e) {} }
function load(k) { try { return localStorage.getItem('tree-lab-' + k); } catch (e) { return null; } }
function setTheme(t) { if (t) document.documentElement.setAttribute('data-theme', t); else document.documentElement.removeAttribute('data-theme'); save('theme', t || ''); }
function toggleQuiz() {
  S.quiz = !S.quiz; S.answered = {};
  $('bQuiz').classList.toggle('on', S.quiz);
  $('bQuiz').innerHTML = `What happens next? ${S.quiz ? 'on' : 'off'} <kbd>Q</kbd>`;
  render();
}
function toggleFs() { try { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen(); } catch (e) {} }

function init() {
  $('preset').innerHTML = PRESETS.map(p => `<option value="${p.id}">${p.label}</option>`).join('');
  $('op').innerHTML = Object.entries(OPS).map(([id, o]) => `<option value="${id}">${o.label}</option>`).join('');
  $('preset').onchange = () => { S.preset = $('preset').value; loadPreset(); rebuild(); };
  $('op').onchange = () => { S.op = $('op').value; S.bug = S.bug && !!OPS[S.op].bug; $('bugBtn').classList.toggle('on', S.bug); save('op', S.op); runOp(); };
  $('runBtn').onclick = runOp;
  $('val').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); runOp(); } });
  $('buildBtn').onclick = buildCustom;
  $('custom').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); buildCustom(); } });
  $('bugBtn').onclick = () => { if (!OPS[S.op].bug) return; S.bug = !S.bug; $('bugBtn').classList.toggle('on', S.bug); rebuild(); };
  $('bStep').onclick = step; $('bBack').onclick = back; $('bPlay').onclick = play;
  $('bRestart').onclick = () => { stop(); S.at = 0; S.answered = {}; render(); };
  $('scrub').oninput = () => { stop(); S.at = +$('scrub').value; render(); };
  $('bQuiz').onclick = toggleQuiz;
  $('themeBtn').onclick = () => {
    const dark = document.documentElement.getAttribute('data-theme') === 'dark' ||
      (!document.documentElement.getAttribute('data-theme') && matchMedia('(prefers-color-scheme: dark)').matches);
    setTheme(dark ? 'light' : 'dark');
  };
  $('fsBtn').onclick = toggleFs;
  document.addEventListener('keydown', e => {
    if (e.target.matches('input[type=text], select') || e.ctrlKey || e.metaKey || e.altKey) return;
    const k = e.key;
    if (k === 'ArrowRight' || k === ' ') { e.preventDefault(); step(); }
    else if (k === 'ArrowLeft') { e.preventDefault(); back(); }
    else if (k === 'r' || k === 'R') $('bRestart').click();
    else if (k === 'p' || k === 'P') play();
    else if (k === 'q' || k === 'Q') toggleQuiz();
    else if (k === 'm' || k === 'M') $('bugBtn').click();
    else if (k === 'f' || k === 'F') toggleFs();
  });
  const t = load('theme'); if (t) setTheme(t);
  // A link can open one exact step: #tree=T&op=delete&value=3&mistake=1&at=12&quiz=1&theme=light
  const h = new URLSearchParams(location.hash.slice(1));
  if (['light', 'dark'].includes(h.get('theme'))) setTheme(h.get('theme'));
  if (PRESETS.some(p => p.id === h.get('tree'))) { S.preset = h.get('tree'); $('preset').value = S.preset; }
  const op = OPS[h.get('op')] ? h.get('op') : (OPS[load('op')] ? load('op') : 'contains');
  S.op = op; $('op').value = op;
  if (h.get('value') !== null && Number.isInteger(Number(h.get('value')))) { S.value = Number(h.get('value')); }
  $('val').value = S.value;
  if (h.get('mistake') === '1' && OPS[op].bug) { S.bug = true; $('bugBtn').classList.add('on'); }
  loadPreset(); rebuild();
  const at = parseInt(h.get('at'), 10);
  if (at > 0) { S.at = Math.min(at, S.frames.length - 1); render(); }
  if (h.get('quiz') === '1') toggleQuiz();
}

/* Self-check: open the page as tree-lab.html#selftest. It checks the four
   walks of T, search, insert, delete (all three cases, and the root), the
   height, is_valid, each common mistake, and 200 random insert and delete
   sequences against a sorted set. */
function selftest() {
  const lines = [], ok = (c, m) => lines.push((c ? 'PASS ' : 'FAIL ') + m);
  const T0 = buildTree([8, 3, 10, 1, 6, 14, 4, 7, 13]);
  const run = (op, tree, value, bug) => { const keep = S.bug; S.bug = !!bug; const fr = trace(op, tree, value); S.bug = keep; return fr[fr.length - 1]; };
  ok(run('in_order', T0).result === '[1, 3, 4, 6, 7, 8, 10, 13, 14]', 'in-order of T is sorted');
  ok(run('pre_order', T0).result === '[8, 3, 1, 6, 4, 7, 10, 14, 13]', 'pre-order of T');
  ok(run('post_order', T0).result === '[1, 4, 7, 6, 3, 13, 14, 10, 8]', 'post-order of T');
  ok(run('level_order', T0).result === '[8, 3, 10, 1, 6, 14, 4, 7, 13]', 'level-order of T');
  let f = run('contains', T0, 7); ok(f.result === 'True' && f.cnt.visits === 4, `contains(7): True after visiting ${f.cnt.visits} nodes (4)`);
  f = run('contains', T0, 5); ok(f.result === 'False' && f.path.length === 4, 'contains(5): False, path 8, 3, 6, 4');
  f = run('insert', T0, 5); ok(validBST(f.tree) && inorderValues(f.tree).join() === '1,3,4,5,6,7,8,10,13,14', 'insert(5): 5 becomes a leaf, still a BST');
  ok(run('height', T0).result === '3' && run('height', buildTree([1, 2, 3, 4, 5, 6, 7])).result === '6', 'height: T is 3, the chain 1..7 is 6');
  ok(run('min', T0).result === '1' && run('max', T0).result === '14', 'min 1, max 14');
  for (const [v, desc] of [[1, 'a leaf'], [14, 'one child'], [3, 'two children'], [8, 'the root']]) {
    f = run('delete', T0, v); const want = [1, 3, 4, 6, 7, 8, 10, 13, 14].filter(x => x !== v).join();
    ok(validBST(f.tree) && inorderValues(f.tree).join() === want, `delete(${v}), ${desc}: still a BST without ${v}`);
  }
  ok(run('is_valid', T0).result === 'True' && run('is_valid', brokenTree()).result === 'False', 'is_valid: T True, the broken tree False');
  ok(run('is_valid', brokenTree(), null, true).result === 'True', 'is_valid mistake: the broken tree passes (wrongly)');
  ok(run('height', T0, null, true).result === '4', 'height mistake: T comes out as 4');
  ok(run('insert', T0, 5, true).lost === true && inorderValues(run('insert', T0, 5, true).tree).length === 9, 'insert mistake: the tree does not change');
  ok(!validBST(run('delete', T0, 8, true).tree), 'delete mistake: delete(8) breaks the tree');
  ok(run('contains', T0, 7, true).result === 'False', 'contains mistake: 7 is not found');
  ok(run('level_order', T0, null, true).result !== '[8, 3, 10, 1, 6, 14, 4, 7, 13]', 'level-order mistake (a stack): not level by level');
  let bad = 0;
  for (let k = 0; k < 200; k++) {
    let tree = emptyTree(); const set = new Set();
    for (let s = 0; s < 25; s++) {
      const v = Math.floor(Math.random() * 30);
      if (Math.random() < 0.65) { tree = run('insert', tree, v).tree; set.add(v); } else { tree = run('delete', tree, v).tree; set.delete(v); }
    }
    const want = [...set].sort((a, b) => a - b).join();
    if (inorderValues(tree).join() !== want || !validBST(tree) || run('contains', tree, 7).result !== (set.has(7) ? 'True' : 'False')) bad++;
  }
  ok(bad === 0, `200 random insert/delete sequences agree with a sorted set (${bad} failures)`);
  const pre = $('selftest'); pre.hidden = false; pre.textContent = lines.join('\n');
  document.title = (lines.every(l => l.startsWith('PASS')) ? 'PASS' : 'FAIL') + ' — Tree Lab';
}

init();
if (location.hash === '#selftest') selftest();
</script>
